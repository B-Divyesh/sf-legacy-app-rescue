name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to package, such as v0.1.2
        required: false
        default: v0.1.2

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            kind: linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            kind: windows
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            kind: macos
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            kind: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Require the release tag to match Cargo
        shell: bash
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "$PACKAGE_VERSION"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Build and test
        shell: bash
        run: |
          cargo test --locked
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package Linux
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          mkdir -p package/stage
          cp "target/${{ matrix.target }}/release/rescue" package/stage/rescue
          tar -C package/stage -czf package/rescue-linux-x86_64.tar.gz rescue
          cargo install cargo-deb --locked
          cargo deb --no-build --target "${{ matrix.target }}"
          cp "$(find target -name '*.deb' -print -quit)" package/rescue-linux-x86_64.deb
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_amd64.deb -o package/nfpm.deb
          sudo dpkg -i package/nfpm.deb
          sudo apt-get update
          sudo apt-get install -y dnf rpm
          PACKAGE_VERSION="$PACKAGE_VERSION" nfpm package --config packaging/nfpm.yaml --packager rpm --target package/rescue-linux-x86_64.rpm
      - name: Verify Linux package identities and a real RPM upgrade
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          test "$(dpkg-deb -f package/rescue-linux-x86_64.deb Version)" = "$PACKAGE_VERSION-1"
          mkdir -p "$RUNNER_TEMP/deb-root" "$RUNNER_TEMP/archive-root"
          dpkg-deb -x package/rescue-linux-x86_64.deb "$RUNNER_TEMP/deb-root"
          tar -C "$RUNNER_TEMP/archive-root" -xzf package/rescue-linux-x86_64.tar.gz
          test "$("$RUNNER_TEMP/deb-root/usr/bin/rescue" --version)" = "rescue $PACKAGE_VERSION"
          test "$("$RUNNER_TEMP/archive-root/rescue" --version)" = "rescue $PACKAGE_VERSION"
          PACKAGE_VERSION=0.1.1 nfpm package --config packaging/nfpm.yaml --packager rpm --target "$RUNNER_TEMP/rescue-0.1.1.rpm"
          test "$(rpm -qp package/rescue-linux-x86_64.rpm --qf '%{VERSION}-%{RELEASE}')" = "$PACKAGE_VERSION-1"
          RPM_ROOT="$RUNNER_TEMP/rpm-root"
          sudo dnf --installroot="$RPM_ROOT" --releasever=42 --disablerepo='*' install -y "$RUNNER_TEMP/rescue-0.1.1.rpm"
          test "$(sudo rpm --root "$RPM_ROOT" -q legacy-app-rescue --qf '%{VERSION}-%{RELEASE}')" = "0.1.1-1"
          sudo dnf --installroot="$RPM_ROOT" --releasever=42 --disablerepo='*' upgrade -y "$PWD/package/rescue-linux-x86_64.rpm"
          test "$(sudo rpm --root "$RPM_ROOT" -q legacy-app-rescue --qf '%{VERSION}-%{RELEASE}')" = "$PACKAGE_VERSION-1"
          test "$("$RPM_ROOT/usr/bin/rescue" --version)" = "rescue $PACKAGE_VERSION"
      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rescue.exe" package/stage/rescue.exe
          Compress-Archive package/stage/rescue.exe package/rescue-windows-x86_64.zip
      - name: Verify Windows archive and binary version
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Expand-Archive package/rescue-windows-x86_64.zip "$env:RUNNER_TEMP/rescue-version"
          $actual = & "$env:RUNNER_TEMP/rescue-version/rescue.exe" --version
          if ($actual -ne "rescue $env:PACKAGE_VERSION") { throw "Windows binary version is $actual" }
      - name: Package macOS
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p package/stage/usr/local/bin package/tar
          cp "target/${{ matrix.target }}/release/rescue" package/stage/usr/local/bin/rescue
          cp "target/${{ matrix.target }}/release/rescue" package/tar/rescue
          tar -C package/tar -czf "package/rescue-${{ matrix.label }}.tar.gz" rescue
          VERSION="${RELEASE_TAG#v}"
          pkgbuild --root package/stage --identifier in.sociobot.legacy-app-rescue --version "$VERSION" --install-location / "package/rescue-${{ matrix.label }}.pkg"
      - name: Verify macOS archive, package, and binary versions
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/pkg"
          tar -C "$RUNNER_TEMP/archive" -xzf "package/rescue-${{ matrix.label }}.tar.gz"
          test "$("$RUNNER_TEMP/archive/rescue" --version)" = "rescue $PACKAGE_VERSION"
          pkgutil --expand "package/rescue-${{ matrix.label }}.pkg" "$RUNNER_TEMP/pkg/expanded"
          grep -q "version=\"$PACKAGE_VERSION\"" "$RUNNER_TEMP/pkg/expanded/PackageInfo"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: package/rescue-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      TAP_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write checksums and package manifests
        run: |
          cd release
          sha256sum rescue-* > SHA256SUMS
          cd ..
          node scripts/release-manifest.mjs release "$RELEASE_TAG" "$GITHUB_REPOSITORY"
          test -s release/latest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*
      - name: Publish package manifests in the product repository
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp release/legacy-app-rescue.rb Formula/legacy-app-rescue.rb
          cp release/legacy-app-rescue-scoop.json bucket/legacy-app-rescue.json
          cp release/legacy-app-rescue-scoop.json scoop-bucket/legacy-app-rescue.json
          cp release/B-Divyesh.LegacyAppRescue.yaml winget/B-Divyesh.LegacyAppRescue.yaml
          git config user.name "Param Factory release bot"
          git config user.email "factory@sociobot.in"
          git add Formula bucket scoop-bucket winget
          git diff --cached --quiet || git commit -m "release: publish package manifests ${RELEASE_TAG}"
          git push origin main
      - name: Update Homebrew tap when operator token is available
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/B-Divyesh/homebrew-legacy-app-rescue.git" tap
          mkdir -p tap/Formula
          cp release/legacy-app-rescue.rb tap/Formula/legacy-app-rescue.rb
          cd tap
          git config user.name "Param Factory release bot"
          git config user.email "factory@sociobot.in"
          git add Formula/legacy-app-rescue.rb
          git diff --cached --quiet || git commit -m "legacy-app-rescue ${RELEASE_TAG}"
          git push
